name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Write the private denylist from a secret
        env:
          DENYLIST: ${{ secrets.DOCS_DENYLIST }}
        run: printf '%s\n' "$DENYLIST" > .denylist
      - run: npm test
      - run: npx astro build
      - name: Run the content checks
        env:
          REQUIRE_DENYLIST: '1'
        run: npm run check
